name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# scripts/ci-local.sh runs the same gates, through the same scripts, in the same order; its header
# says which jobs below it cannot run and why.
jobs:
  build:
    name: Build, test, lint, format
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The formatter is pinned once, in scripts/tools.sh, with the other C++ repos of the fleet.
      - name: clang-format (JNI, check only)
        run: scripts/check-format.sh

      - name: Play metadata lint (lengths, counts, dimensions)
        run: python scripts/check_play_metadata.py

      - name: Translations are complete in every locale
        run: python scripts/check-translations.py

      - name: Release script tests
        run: python -m unittest discover -s scripts -p '*_test.py' -t scripts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Lint check
        run: ./gradlew lintGithubDebug lintPlayDebug lintAmazonDebug

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest testAmazonDebugUnitTest

      - name: Run native unit tests
        run: ./gradlew :app:nativeTest

      - name: Build the debug APKs (all three distribution flavors); each carries its flavor's ABIs
        run: scripts/check-builds.sh debug

      # Debug builds are not minified, so only a release build shows whether R8 kept every member
      # native code resolves by name. This builds what the tag builds, unsigned: the GitHub APK, the
      # Play APK and bundle, and the Amazon APK, each checked for its ABIs and for the kept members.
      - name: Build the release variants, unsigned; check their ABIs and kept members
        run: scripts/check-builds.sh release

      - name: libsodium uses 128-bit arithmetic on 64-bit ABIs only
        run: python scripts/check_sodium_ti_mode.py app/.cxx

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  instrumented:
    name: Integration tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build app + test APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: Run integration tests
        # Same emulator path the screenshots workflow uses (google_apis, KVM):
        # a known-good CI image for this app's GameActivity. Scoped to the
        # integration package. The pixel6Api34 managed device stays for local
        # runs (scripts/ci-local.sh --with-gmd).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: >-
            ./gradlew :app:connectedGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.package=com.tinkernorth.dish.integration

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  native-armv7:
    name: C++ host tests (32-bit ARM, qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the armhf cross compiler and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user

      - name: Build and run under qemu-arm
        run: scripts/native-tests.sh armv7

  # The host tests and the host bench with the runner's own g++, the lock-statistics build
  # included, so the lock laws and both bench smokes run on x86_64 as well as under qemu.
  native-x86_64:
    name: C++ host tests and bench smoke (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, run the host tests and the bench smoke, then the measurements report tests
        run: scripts/native-tests.sh host

  # The amazon APK has no 32-bit x86 library, so this x86 image (ABIs x86, armeabi-v7a, armeabi)
  # installs it as armeabi-v7a and runs libsatellite.so through its ARM translation, as on a 32-bit
  # Fire tablet.
  instrumented-arm-translation:
    name: Integration tests (API 28, armeabi-v7a through ARM translation)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build app + test APKs (amazon flavor)
        run: ./gradlew :app:assembleAmazonDebug :app:assembleAmazonDebugAndroidTest

      - name: The APK carries no 32-bit x86 library
        run: python3 scripts/check_apk_abis.py app/build/outputs/apk/amazon/debug/app-amazon-debug.apk armeabi-v7a arm64-v8a x86_64

      - name: Run integration tests through ARM translation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: google_apis
          arch: x86
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash scripts/ci_arm_translation_proof.sh app/build/outputs/apk/amazon/debug/app-amazon-debug.apk
            ./gradlew :app:connectedAmazonDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.tinkernorth.dish.integration

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-arm-translation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
