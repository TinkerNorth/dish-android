name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pinned to match satellite + dish-linux + dish-mac so all four repos
      # share one canonical clang-format ruleset and tool version.
      - name: Install clang-format (pinned 22.1.4)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'clang-format==22.1.4'

      - name: clang-format (JNI, check only)
        run: |
          FILES=$(find app/src/main/cpp -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \))
          [ -z "$FILES" ] || echo "$FILES" | xargs clang-format --dry-run --Werror

      - name: Play metadata lint (lengths, counts, dimensions)
        run: python scripts/check_play_metadata.py

      - name: Release script tests
        run: python -m unittest discover -s scripts -p '*_test.py' -t scripts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ktlint check
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Lint check
        run: ./gradlew lintGithubDebug lintPlayDebug lintAmazonDebug

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest testAmazonDebugUnitTest

      - name: Run native unit tests
        run: ./gradlew :app:nativeTest

      - name: Build debug APKs (all three distribution flavors)
        run: ./gradlew assembleGithubDebug assemblePlayDebug assembleAmazonDebug

      - name: Each APK carries its flavor's ABIs
        run: |
          python scripts/check_apk_abis.py app/build/outputs/apk/github/debug/app-github-debug.apk armeabi-v7a arm64-v8a x86_64
          python scripts/check_apk_abis.py app/build/outputs/apk/play/debug/app-play-debug.apk armeabi-v7a arm64-v8a x86_64
          python scripts/check_apk_abis.py app/build/outputs/apk/amazon/debug/app-amazon-debug.apk armeabi-v7a arm64-v8a x86_64

      - name: libsodium uses 128-bit arithmetic on 64-bit ABIs only
        run: python scripts/check_sodium_ti_mode.py app/.cxx

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

  instrumented:
    name: Integration tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build app + test APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: Run integration tests
        # Same emulator path the screenshots workflow uses (google_apis, KVM):
        # a known-good CI image for this app's GameActivity. Scoped to the
        # integration package. The pixel6Api34 managed device stays for local
        # runs (scripts/ci_local.sh --gmd).
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: >-
            ./gradlew :app:connectedGithubDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.package=com.tinkernorth.dish.integration

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  native-armv7:
    name: C++ host tests (32-bit ARM, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the armhf cross compiler and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user

      # NEON is part of Android's armeabi-v7a baseline, but this compiler defaults to VFPv3-D16
      # alone, which opus's NEON sources cannot build against.
      - name: Configure for armv7
        run: >-
          cmake -S app/src/test/cpp -B build/native-test-armv7
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=arm
          -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc
          -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
          -DCMAKE_C_FLAGS=-mfpu=neon
          -DCMAKE_CXX_FLAGS=-mfpu=neon
          "-DCMAKE_CROSSCOMPILING_EMULATOR=qemu-arm;-L;/usr/arm-linux-gnueabihf"

      - name: Build
        run: cmake --build build/native-test-armv7 --parallel

      - name: The test binaries are 32-bit ARM
        run: |
          file build/native-test-armv7/gamepad_input_test
          file build/native-test-armv7/gamepad_input_test | grep -q 'ELF 32-bit LSB .* ARM'

      - name: Run under qemu-arm
        run: ctest --test-dir build/native-test-armv7 --output-on-failure --no-tests=error

  # The host tests and the host bench with the runner's own g++, the lock-statistics build
  # included, so the lock laws and both bench smokes run on x86_64 as well as under qemu.
  native-x86_64:
    name: C++ host tests and bench smoke (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -S app/src/test/cpp -B build/native-test -DDISH_BENCH_LOCKSTATS=ON

      - name: Build
        run: cmake --build build/native-test --parallel

      - name: Run the host tests
        run: ctest --test-dir build/native-test --output-on-failure --no-tests=error

      - name: Bench smoke
        run: build/native-test/bench_send_path --smoke

      # measurements.yml's report, also read against the JSON both smokes under ctest wrote.
      - name: Measurements report tests
        env:
          DISH_BENCH_JSON: build/native-test/send_path_bench_smoke.json:build/native-test/send_path_bench_lockstats_smoke.json
        run: python3 -m unittest discover -s scripts -p 'measurements_report_test.py' -t scripts

  # The amazon APK has no 32-bit x86 library, so this x86 image (ABIs x86, armeabi-v7a, armeabi)
  # installs it as armeabi-v7a and runs libsatellite.so through its ARM translation, as on a 32-bit
  # Fire tablet.
  instrumented-arm-translation:
    name: Integration tests (API 28, armeabi-v7a through ARM translation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pre-install CMake 3.22.1
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build app + test APKs (amazon flavor)
        run: ./gradlew :app:assembleAmazonDebug :app:assembleAmazonDebugAndroidTest

      - name: The APK carries no 32-bit x86 library
        run: python3 scripts/check_apk_abis.py app/build/outputs/apk/amazon/debug/app-amazon-debug.apk armeabi-v7a arm64-v8a x86_64

      - name: Run integration tests through ARM translation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: google_apis
          arch: x86
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash scripts/ci_arm_translation_proof.sh app/build/outputs/apk/amazon/debug/app-amazon-debug.apk
            ./gradlew :app:connectedAmazonDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.tinkernorth.dish.integration

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-arm-translation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
