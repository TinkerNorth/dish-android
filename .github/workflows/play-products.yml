name: Play Products Sync

# Creates or updates the Play tip-jar products (one-time tips and the
# supporter subscription with its base plans) from play/products.json via
# the Play Developer API. Idempotent: rerunning it re-applies the spec and
# activates any base plan still in draft. Needs PLAY_SERVICE_ACCOUNT_JSON,
# and the app record must already hold an uploaded build that declares the
# BILLING permission, or Play refuses to create products. A dry run prints
# the payloads and writes nothing.
#
# Pin map (verify with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`):
#   actions/checkout                @ v7.0.1  → 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python            @ v7.0.0  → 5fda3b95a4ea91299a34e894583c3862153e4b97

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the payloads without writing to Play"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync products to Play
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Gate on Play credentials
        id: gate
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON not set. Add the service-account key secret first."
            exit 1
          fi
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "${RUNNER_TEMP}/play-key.json"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install API clients
        run: python -m pip install 'google-auth==2.37.0' 'requests==2.32.3'

      - name: Sync products
        env:
          PLAY_KEY_FILE: ${{ runner.temp }}/play-key.json
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/play_products.py "${args[@]}"
