name: Security

# Security gates on every pull request, every push to main and weekly. The jobs live in the
# shared _security.yml (action-pin lint, allowlist expiry, OSV-Scanner, dependency review,
# gitleaks); CodeQL lives in codeql.yml because it has its own matrix.
#
# Maven dependencies are scanned from the committed Gradle lockfiles (gradle.lockfile and
# app/gradle.lockfile, CONTRIBUTING.md "Dependency locking"): OSV-Scanner reads them, and the
# build fails on a lockfile that is stale. Grype scans the release artifacts in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    # Exactly what _security.yml declares; a narrower grant fails the call at startup.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_security.yml
    with:
      osv_scan_paths: .
      dependency_review_enabled: true
