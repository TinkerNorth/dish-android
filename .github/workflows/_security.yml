name: _security (reusable)

# Shared security gates, byte-identical in every TinkerNorth repository: action-pin lint,
# allowlist expiry, OSV-Scanner, dependency review, gitleaks. security.yml calls it on every
# pull request, push to main and weekly; release.yml's `gates` job calls it on the tag.
#
# Source of truth: TinkerNorth/satellite/.github/workflows/_security.yml. A copy is synced
# with `cp`, never edited in place; every per-repository difference is an input below.
#
# The jobs run the repository's own copies of three shared scripts, so CI and
# scripts/ci-local.sh run the same thing:
#   scripts/check-action-pins.sh    the pin lint
#   scripts/security-allowlist.py   the allowlist gate and its OSV-Scanner form
#   scripts/osv-scan.sh             the OSV-Scanner invocation
#
# Each downloaded tool is pinned by version and by the SHA-256 of its linux-amd64 asset,
# copied from the upstream checksum file named beside it. Every job runs on ubuntu-24.04.
#
# Job names are required status checks: renaming one breaks branch protection.

on:
  workflow_call:
    inputs:
      osv_scan_paths:
        description: "Newline- or comma-separated directories OSV-Scanner scans recursively. Empty scans only the osv_lockfile_script output."
        required: false
        type: string
        default: "."
      osv_config:
        description: "Repo-relative OSV-Scanner TOML merged under the allowlist (settings and [[PackageOverrides]]; never [[IgnoredVulns]]). Empty for none."
        required: false
        type: string
        default: ""
      osv_lockfile_script:
        description: "Repo-relative bash script printing an OSV-Scanner custom lockfile for vendored code named by upstream commit. Empty for none."
        required: false
        type: string
        default: ""
      osv_allow_no_packages:
        description: "The repository has no manifest OSV-Scanner reads, so 'no packages found' passes instead of failing. Say why at the call site."
        required: false
        type: boolean
        default: false
      gitleaks_config:
        description: "Repo-relative gitleaks config. It must exist."
        required: false
        type: string
        default: ".gitleaks.toml"
      dependency_review_enabled:
        description: "Run actions/dependency-review-action on pull requests. Needs the repository's Dependency graph setting on; the job blocks on a high-severity finding."
        required: false
        type: boolean
        default: true

# A called workflow cannot hold more than its caller granted, and asking for more fails the
# run at startup, so this is the grant every caller (security.yml, release.yml `gates`) gives:
#   contents: read       checkout, and the dependency-graph comparison dependency review reads
#   pull-requests: read  dependency review reads the pull request it runs for
# Nothing uploads to code scanning (the gitleaks SARIF is a workflow artifact), so there is
# no security-events scope.
permissions:
  contents: read
  pull-requests: read

jobs:
  action-pin-lint:
    name: Action pin lint (40-char SHA required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every uses reference
        shell: bash
        run: sh scripts/check-action-pins.sh

  allowlist-expiry:
    name: Vulnerability allowlist expiry check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        shell: bash
        env:
          PYYAML_VERSION: "6.0.4"
          # pyyaml-6.0.4-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl,
          # from https://pypi.org/pypi/PyYAML/6.0.4/json
          PYYAML_SHA256: "93bfb2459195406a518e2f487a9bbf01df240175f31e06f5a252ac6734c7bbf0"
        run: |
          set -euo pipefail
          printf 'pyyaml==%s --hash=sha256:%s\n' "$PYYAML_VERSION" "$PYYAML_SHA256" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --quiet --disable-pip-version-check --only-binary :all: \
            --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      - name: Validate .security/allowlist.yaml
        shell: bash
        run: python scripts/security-allowlist.py check

  osv-scanner:
    if: ${{ inputs.osv_scan_paths != '' || inputs.osv_lockfile_script != '' }}
    name: OSV-Scanner (vendored + manifest deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        shell: bash
        env:
          PYYAML_VERSION: "6.0.4"
          # Same wheel and source as the allowlist-expiry job.
          PYYAML_SHA256: "93bfb2459195406a518e2f487a9bbf01df240175f31e06f5a252ac6734c7bbf0"
        run: |
          set -euo pipefail
          printf 'pyyaml==%s --hash=sha256:%s\n' "$PYYAML_VERSION" "$PYYAML_SHA256" > "$RUNNER_TEMP/requirements.txt"
          python -m pip install --quiet --disable-pip-version-check --only-binary :all: \
            --require-hashes -r "$RUNNER_TEMP/requirements.txt"

      # From the upstream release rather than an action wrapper, to keep the supply-chain
      # surface to one checksummed binary.
      - name: Install OSV-Scanner
        shell: bash
        env:
          OSV_SCANNER_VERSION: "2.7.1"
          # osv-scanner_linux_amd64, from osv-scanner_SHA256SUMS on the v2.7.1 release.
          OSV_SCANNER_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum -c -
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/osv-scanner" --version

      - name: Run OSV-Scanner
        shell: bash
        env:
          SCAN_PATHS: ${{ inputs.osv_scan_paths }}
          OSV_CONFIG: ${{ inputs.osv_config }}
          LOCKFILE_SCRIPT: ${{ inputs.osv_lockfile_script }}
          ALLOW_NO_PACKAGES: ${{ inputs.osv_allow_no_packages }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$OSV_CONFIG" ]; then args+=(--config "$OSV_CONFIG"); fi
          if [ -n "$LOCKFILE_SCRIPT" ]; then args+=(--lockfile-script "$LOCKFILE_SCRIPT"); fi
          if [ "$ALLOW_NO_PACKAGES" = "true" ]; then args+=(--allow-no-packages); fi
          paths=()
          while IFS= read -r item; do
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            if [ -n "$item" ]; then paths+=("$item"); fi
          done < <(printf '%s\n' "$SCAN_PATHS" | tr ',' '\n')
          bash scripts/osv-scan.sh "${args[@]}" -- "${paths[@]}"

  dependency-review:
    if: ${{ inputs.dependency_review_enabled && github.event_name == 'pull_request' }}
    name: Dependency review (GitHub advisory DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Blocking. It reads the repository's dependency graph, which must be switched on
      # (Settings, Code security, Dependency graph); without it the action fails, so a
      # repository with the setting off passes dependency_review_enabled: false.
      - name: Review changed dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Not gitleaks/gitleaks-action: that needs a paid licence for organisation accounts.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          # gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt on the release.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/gitleaks" version

      - name: Run gitleaks over the full history
        shell: bash
        env:
          GITLEAKS_CONFIG: ${{ inputs.gitleaks_config }}
        run: |
          set -euo pipefail
          if [ ! -f "$GITLEAKS_CONFIG" ]; then
            echo "::error::gitleaks config '$GITLEAKS_CONFIG' does not exist"
            exit 1
          fi
          # --redact keeps any hit out of the public run log.
          gitleaks git \
            --config="$GITLEAKS_CONFIG" \
            --redact \
            --verbose \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=gitleaks-report.sarif \
            .

      - name: Upload gitleaks SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
